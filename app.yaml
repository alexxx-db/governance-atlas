# Databricks App configuration — single source of truth.
# Docs: https://docs.databricks.com/en/dev-tools/databricks-apps/app-config.html
#
# This in-repo file is the PORTABLE default: no workspace-specific catalogs,
# emails, Genie spaces, or Lakebase endpoints. Deploys never ship it verbatim —
# scripts/prepare_bundle.py --target <t> regenerates the packaged app.yaml with
# per-target values resolved from databricks.yml (the Databricks Apps platform
# reads env vars only from app.yaml in the deployed source code; the
# databricks_app Terraform resource has no config/env attribute, so values in
# databricks.yml under resources.apps.axiom.config.env never reach the running
# app via `databricks bundle deploy` alone).

command:
  - python
  - run_app.py

env:
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: "sql-warehouse"
  - name: AXIOM_CATALOG
    value: "main"
  - name: AXIOM_SCHEMA
    value: "axiom"
  - name: AXIOM_DISCOVERY_CATALOGS
    value: ""
  - name: AXIOM_ADMIN_EMAILS
    value: ""
  - name: AXIOM_ENVIRONMENT_LABEL
    value: ""
  - name: AXIOM_DEPLOY_TARGET
    value: ""
  - name: AXIOM_AI_PROVIDER
    value: "local"
  - name: AXIOM_GENIE_SPACE_ID
    value: "not-configured"
  - name: AXIOM_GENIE_SPACE_TITLE
    value: "Axiom Metadata Room"
  - name: AXIOM_AI_REQUIRE_BENCHMARK
    value: "false"
  - name: AXIOM_LAKEBASE_ENABLED
    value: "false"
  - name: AXIOM_LAKEBASE_ENDPOINT_NAME
    value: "not-configured"
  - name: AXIOM_LAKEBASE_SCHEMA
    value: "axiom_app"
  - name: AXIOM_LAKEBASE_UC_CATALOG
    value: "not-configured"
  - name: AXIOM_AI_GENERATION_ENDPOINT
    value: "databricks-claude-sonnet-4-6"
  - name: AXIOM_LINEAGE_LOOKBACK_DAYS
    value: "90"
  - name: AXIOM_EMET_CATALOG
    value: ""
  - name: AXIOM_SCHEMA_BOOTSTRAP
    value: "auto"
  - name: AXIOM_AI_FEATURES_ENABLED
    value: "false"
  - name: AXIOM_AI_INTAKE_TAG_KEY
    value: "edw_intake_id"
  - name: AXIOM_AI_TIER_TAG_KEY
    value: "ai_risk_tier"
  - name: AXIOM_AI_CATALOG_ALLOWLIST
    value: ""
  - name: AXIOM_AI_TOOL_SCHEMA_ALLOWLIST
    value: ""
  - name: AXIOM_AI_INTAKE_GRACE_DAYS
    value: "30"
