# Databricks App configuration — single source of truth.
# Docs: https://docs.databricks.com/en/dev-tools/databricks-apps/app-config.html
#
# This in-repo file is the PORTABLE default: no workspace-specific catalogs,
# emails, Genie spaces, or Lakebase endpoints. Deploys never ship it verbatim —
# scripts/prepare_bundle.py --target <t> regenerates the packaged app.yaml with
# per-target values resolved from databricks.yml (the Databricks Apps platform
# reads env vars only from app.yaml in the deployed source code; the
# databricks_app Terraform resource has no config/env attribute, so values in
# databricks.yml under resources.apps.atlas.config.env never reach the running
# app via `databricks bundle deploy` alone).

command:
  - python
  - run_app.py

env:
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: "sql-warehouse"
  - name: GOVAT_CATALOG
    value: "main"
  - name: GOVAT_SCHEMA
    value: "governance_atlas"
  - name: GOVAT_DISCOVERY_CATALOGS
    value: ""
  - name: GOVAT_ADMIN_EMAILS
    value: ""
  - name: GOVAT_ENVIRONMENT_LABEL
    value: ""
  - name: GOVAT_DEPLOY_TARGET
    value: ""
  - name: GOVAT_ATLAS_AI_PROVIDER
    value: "local"
  - name: GOVAT_GENIE_SPACE_ID
    value: "not-configured"
  - name: GOVAT_GENIE_SPACE_TITLE
    value: "Governance Atlas Metadata Room"
  - name: GOVAT_ATLAS_AI_REQUIRE_BENCHMARK
    value: "false"
  - name: GOVAT_LAKEBASE_ENABLED
    value: "false"
  - name: GOVAT_LAKEBASE_ENDPOINT_NAME
    value: "not-configured"
  - name: GOVAT_LAKEBASE_SCHEMA
    value: "atlas_app"
  - name: GOVAT_LAKEBASE_UC_CATALOG
    value: "not-configured"
  - name: GOVAT_AI_GENERATION_ENDPOINT
    value: "databricks-claude-opus-4-8"
  - name: GOVAT_LINEAGE_LOOKBACK_DAYS
    value: "365"
