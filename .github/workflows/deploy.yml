name: Deploy Governance Atlas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "DAB target (dev | staging | prod)"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  contents: read
  id-token: write # GitHub OIDC token for Databricks workload identity federation

# Auth: GitHub OIDC -> Databricks service principal (no stored PAT).
# One-time setup per workspace:
#   1. Create a service principal; note its application (client) ID.
#   2. Add a federation policy on it: issuer https://token.actions.githubusercontent.com,
#      audience = the Databricks account ID, subject per job:
#        validate (PR):   repo:<org>/<repo>:pull_request
#        validate (main): repo:<org>/<repo>:ref:refs/heads/main
#        deploy:          repo:<org>/<repo>:environment:<dev|staging|prod>
#   3. GitHub variables DATABRICKS_HOST + DATABRICKS_CLIENT_ID (repo-level for
#      validate; per Environment for deploy if targets use other workspaces).
env:
  DATABRICKS_AUTH_TYPE: github-oidc
  DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
  DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}

jobs:
  validate:
    name: Validate bundle
    runs-on: ubuntu-latest
    env:
      BUNDLE_VAR_warehouse_id: ${{ vars.DATABRICKS_WAREHOUSE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: python3 -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend tests
        working-directory: frontend
        run: npm run test

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Repo hygiene checks
        run: python3 scripts/validate_repo_hygiene.py

      - name: Backend compile check
        run: python3 -m py_compile run_app.py runtime_app.py atlas/api/*.py atlas/services/*.py atlas/*.py scripts/prepare_bundle.py scripts/validate_repo_hygiene.py

      - name: Backend unit tests
        run: python3 -m unittest discover -s tests

      - name: Prepare clean bundle directory
        run: python3 scripts/prepare_bundle.py --output "${RUNNER_TEMP}/atlas_bundle"

      - name: Install Databricks CLI
        uses: databricks/setup-cli@602f285bac0c85e5985bf4c16d5a2befed0578d9 # v1.14.1

      - name: Validate packaged bundle
        working-directory: ${{ runner.temp }}/atlas_bundle
        run: databricks bundle validate -t dev

      - name: Summarize packaged bundle
        working-directory: ${{ runner.temp }}/atlas_bundle
        run: databricks bundle summary -t dev

  deploy:
    name: Deploy (${{ github.event.inputs.target || 'dev' }})
    needs: validate
    runs-on: ubuntu-latest
    # Manual dispatch only: a deploy changes the live app for everyone.
    # Workspace-specific values come from the GitHub Environment named after
    # the target (Settings -> Environments -> <target> -> variables), exposed
    # to the CLI as BUNDLE_VAR_<name>. The deploy runs as the federated
    # service principal, so staging/prod (mode: production) land under the
    # SP's workspace folder, never a person's.
    if: github.event_name == 'workflow_dispatch'
    environment: ${{ github.event.inputs.target }}
    env:
      TARGET: ${{ github.event.inputs.target }}
      BUNDLE_VAR_app_name: ${{ vars.APP_NAME || 'atlas' }}
      BUNDLE_VAR_warehouse_id: ${{ vars.DATABRICKS_WAREHOUSE_ID }}
      BUNDLE_VAR_gov_catalog: ${{ vars.GOV_CATALOG }}
      BUNDLE_VAR_gov_schema: ${{ vars.GOV_SCHEMA }}
      BUNDLE_VAR_admin_emails: ${{ vars.ADMIN_EMAILS }}
      BUNDLE_VAR_discovery_catalogs: ${{ vars.DISCOVERY_CATALOGS }}
      BUNDLE_VAR_environment_label: ${{ vars.ENVIRONMENT_LABEL }}
      BUNDLE_VAR_datapact_catalog: ${{ vars.DATAPACT_CATALOG || 'not-configured' }}
      BUNDLE_VAR_ai_generation_endpoint: ${{ vars.AI_GENERATION_ENDPOINT || 'databricks-claude-opus-4-8' }}
      BUNDLE_VAR_lineage_lookback_days: ${{ vars.LINEAGE_LOOKBACK_DAYS || '365' }}
      BUNDLE_VAR_atlas_ai_provider: ${{ vars.ATLAS_AI_PROVIDER || 'local' }}
      BUNDLE_VAR_genie_space_id: ${{ vars.GENIE_SPACE_ID || 'not-configured' }}
      BUNDLE_VAR_atlas_ai_require_benchmark: ${{ vars.ATLAS_AI_REQUIRE_BENCHMARK || 'false' }}
      BUNDLE_VAR_lakebase_enabled: ${{ vars.LAKEBASE_ENABLED || 'false' }}
      BUNDLE_VAR_lakebase_endpoint_name: ${{ vars.LAKEBASE_ENDPOINT_NAME || 'not-configured' }}
      BUNDLE_VAR_lakebase_branch: ${{ vars.LAKEBASE_BRANCH || 'not-configured' }}
      BUNDLE_VAR_lakebase_database_resource: ${{ vars.LAKEBASE_DATABASE_RESOURCE || 'not-configured' }}
      BUNDLE_VAR_lakebase_schema: ${{ vars.LAKEBASE_SCHEMA || 'atlas_app' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Install Databricks CLI
        uses: databricks/setup-cli@602f285bac0c85e5985bf4c16d5a2befed0578d9 # v1.14.1

      - name: Prepare packaged bundle for target
        run: python3 scripts/prepare_bundle.py --output "${RUNNER_TEMP}/atlas_bundle" --target "$TARGET"

      - name: Deploy packaged bundle
        working-directory: ${{ runner.temp }}/atlas_bundle
        run: databricks bundle deploy -t "$TARGET"

      - name: Deploy Databricks App snapshot
        run: |
          user_name="$(databricks current-user me -o json | python3 -c 'import json,sys; print(json.load(sys.stdin)["userName"])')"
          databricks apps start "$BUNDLE_VAR_app_name" --timeout 20m
          databricks apps deploy "$BUNDLE_VAR_app_name" \
            --source-code-path "/Workspace/Users/${user_name}/.bundle/atlas/${TARGET}/files" \
            --timeout 20m

      - name: Summary
        run: echo "### Deployed ${BUNDLE_VAR_app_name} to **${TARGET}**" >> "$GITHUB_STEP_SUMMARY"
