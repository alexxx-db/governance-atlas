bundle:
  name: atlas

# No workspace profile/host here: pick it with `--profile` (or
# DATABRICKS_CONFIG_PROFILE) so any operator can deploy to their own workspace.
# Workspace-specific values (warehouse, catalogs, admins, Genie, Lakebase) are
# never committed: supply them as BUNDLE_VAR_<name> env vars, e.g. by sourcing
# a gitignored .env.<target> copied from .env.example.
workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

# ── Sync overrides ─────────────────────────────────────────
# The repo-level .gitignore excludes frontend/dist/ from git tracking, but the
# compiled React bundle is the only artifact the FastAPI server can serve.
# Without it _ensure_react_bundle raises and every page render 500s. Explicitly
# include the built frontend in bundle sync so deploys always ship the current
# `npm run build` output even though it stays out of git.
sync:
  include:
    - frontend/dist/**
  exclude:
    - .git/**
    - .github/**
    - .databricks/**
    - .venv/**
    - frontend/node_modules/**
    - node_modules/**
    - docs/northstar_visual_qa/**
    - tests/**

# ── Variables ──────────────────────────────────────────────
# Override per-target or via CLI:
# databricks bundle deploy --profile DEFAULT -t prod --var="warehouse_id=<warehouse-id>"
variables:
  app_name:
    description: "Databricks App name; must be unique per workspace, so give staging/prod distinct names if they share one"
    default: "atlas"
  warehouse_id:
    description: "SQL Warehouse ID the app uses for UC queries"
  gov_catalog:
    description: "UC catalog where governance tables are created"
    default: ""
  gov_schema:
    description: "UC schema within the catalog for governance tables"
    default: ""
  discovery_catalogs:
    description: "Optional comma-separated UC catalog allowlist for representative discovery and lineage coverage; empty means all accessible non-system catalogs"
    default: ""
  admin_emails:
    description: "Comma-separated bootstrap admin emails"
    default: ""
  environment_label:
    description: "User-facing environment label for the app shell"
    default: ""
  deploy_target:
    description: "User-facing bundle target for runtime environment metadata"
    default: ""
  atlas_ai_provider:
    description: "Atlas AI provider: local or genie"
    default: "local"
  genie_space_id:
    description: "Optional Databricks Genie space ID used by Atlas AI"
    default: "not-configured"
  genie_space_title:
    description: "User-facing title for the Atlas AI Genie space"
    default: "Governance Atlas Metadata Room"
  atlas_ai_require_benchmark:
    description: "Whether Atlas AI should report the Genie benchmark as a required readiness gate"
    default: "false"
  lakebase_enabled:
    description: "Whether the app should enable Lakebase-backed operational state"
    default: "false"
  lakebase_endpoint_name:
    description: "Optional Lakebase endpoint path/name for OAuth credential rotation"
    default: "not-configured"
  lakebase_branch:
    description: "Optional Lakebase branch resource path for Databricks App resource binding"
    default: "not-configured"
  lakebase_database_resource:
    description: "Optional Lakebase database resource path for Databricks App resource binding"
    default: "not-configured"
  lakebase_schema:
    description: "Lakebase Postgres schema for app operational tables"
    default: "atlas_app"
  lakebase_uc_catalog:
    description: "Optional UC catalog registered for Lakebase synced/foreign tables"
    default: "not-configured"
  lineage_lookback_days:
    description: "event_date window (days) for system.access lineage reads; lower = cheaper scans but hides older edges"
    default: "365"
  ai_generation_endpoint:
    description: "Foundation-model serving endpoint for AI autofill; empty disables it"
    default: "databricks-claude-opus-4-8"
  # AI governance extension (docs/ai_extension/DESIGN.md section 12).
  ai_features_enabled:
    description: "Show the AI governance surface and /api/ai routes (true | false)"
    default: "false"
  ai_intake_tag_key:
    description: "Tag key on AI assets whose value is the intake ID (match rule M1)"
    default: "edw_intake_id"
  ai_tier_tag_key:
    description: "Tag key on AI assets holding the risk tier (control AIC-03)"
    default: "ai_risk_tier"
  ai_catalog_allowlist:
    description: "Comma-separated catalogs the AI collector reads models from; empty means discovery_catalogs"
    default: ""
  ai_tool_schema_allowlist:
    description: "Comma-separated catalog.schema list whose UC functions count as AI tools"
    default: ""
  ai_intake_grace_days:
    description: "Days an approved intake may go unobserved before registered_not_found"
    default: "30"
  ai_collector_sp:
    description: "Service principal application ID the AI collector job runs as in staging/prod (dev runs as the deploying user, PHASE0 D7)"
    default: ""
  ai_job_schedule_pause_status:
    description: "PAUSED or UNPAUSED for the AI collect-and-reconcile schedule (development mode pauses it regardless)"
    default: "PAUSED"
  datapact_catalog:
    description: "UC catalog hosting the DataPact control plane (<catalog>.datapact). Empty/not-configured = auto-discover from DataPact's /Shared/DataPact pointer file."
    default: "not-configured"

# ── App resource ────────────────────────────────────────────
resources:
  # AI governance extension: collect then reconcile (DESIGN.md 3.4, 12).
  # Jobs collect; the app only reads the derived tables. Both tasks share one
  # run id derived from {{job.run_id}}; config arrives as --env pairs because
  # serverless tasks don't get app-style environment variables.
  jobs:
    atlas_ai_collect_and_reconcile:
      name: atlas-ai-collect-and-reconcile
      max_concurrent_runs: 1
      environments:
        - environment_key: ai_jobs
          spec:
            environment_version: "2"
            dependencies:
              - databricks-sdk==0.95.0
              - pandas>=2.0
              - psycopg[binary,pool]>=3.2
      tasks:
        - task_key: collect_databricks
          environment_key: ai_jobs
          # A retry would re-run a failed task under the same run id; the
          # collector is idempotent, but a real failure should fail once, loudly.
          max_retries: 0
          spark_python_task:
            python_file: ./atlas/ai/jobs/collect_databricks.py
            parameters: &ai_job_params
              - "--repo-root"
              - "${workspace.file_path}"
              - "--job-run-id"
              - "{{job.run_id}}"
              - "--env"
              - "DATABRICKS_WAREHOUSE_ID=${var.warehouse_id}"
              - "--env"
              - "GOVAT_CATALOG=${var.gov_catalog}"
              - "--env"
              - "GOVAT_SCHEMA=${var.gov_schema}"
              - "--env"
              - "GOVAT_DISCOVERY_CATALOGS=${var.discovery_catalogs}"
              - "--env"
              - "GOVAT_AI_INTAKE_TAG_KEY=${var.ai_intake_tag_key}"
              - "--env"
              - "GOVAT_AI_TIER_TAG_KEY=${var.ai_tier_tag_key}"
              - "--env"
              - "GOVAT_AI_CATALOG_ALLOWLIST=${var.ai_catalog_allowlist}"
              - "--env"
              - "GOVAT_AI_TOOL_SCHEMA_ALLOWLIST=${var.ai_tool_schema_allowlist}"
              - "--env"
              - "GOVAT_AI_INTAKE_GRACE_DAYS=${var.ai_intake_grace_days}"
              - "--env"
              - "GOVAT_LAKEBASE_ENABLED=${var.lakebase_enabled}"
              - "--env"
              - "GOVAT_LAKEBASE_ENDPOINT_NAME=${var.lakebase_endpoint_name}"
              - "--env"
              - "GOVAT_LAKEBASE_SCHEMA=${var.lakebase_schema}"
        - task_key: reconcile
          max_retries: 0
          depends_on:
            - task_key: collect_databricks
          environment_key: ai_jobs
          spark_python_task:
            python_file: ./atlas/ai/jobs/reconcile.py
            parameters: *ai_job_params
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: UTC
        pause_status: ${var.ai_job_schedule_pause_status}

  apps:
    atlas:
      name: ${var.app_name}
      description: >
        Governance Atlas - a Databricks-native enterprise metadata workspace
        extending Unity Catalog, deployable to any Databricks workspace.
      source_code_path: ${workspace.root_path}/files
      config:
        command:
          - python
          - run_app.py
        env:
          - name: DATABRICKS_WAREHOUSE_ID
            value_from: sql-warehouse
          - name: GOVAT_CATALOG
            value: ${var.gov_catalog}
          - name: GOVAT_SCHEMA
            value: ${var.gov_schema}
          - name: GOVAT_DISCOVERY_CATALOGS
            value: ${var.discovery_catalogs}
          - name: GOVAT_ADMIN_EMAILS
            value: ${var.admin_emails}
          - name: GOVAT_ENVIRONMENT_LABEL
            value: ${var.environment_label}
          - name: GOVAT_DEPLOY_TARGET
            value: ${var.deploy_target}
          - name: GOVAT_ATLAS_AI_PROVIDER
            value: ${var.atlas_ai_provider}
          - name: GOVAT_GENIE_SPACE_ID
            value: ${var.genie_space_id}
          - name: GOVAT_GENIE_SPACE_TITLE
            value: ${var.genie_space_title}
          - name: GOVAT_ATLAS_AI_REQUIRE_BENCHMARK
            value: ${var.atlas_ai_require_benchmark}
          - name: GOVAT_LAKEBASE_ENABLED
            value: ${var.lakebase_enabled}
          - name: GOVAT_LAKEBASE_ENDPOINT_NAME
            value: ${var.lakebase_endpoint_name}
          - name: GOVAT_LAKEBASE_SCHEMA
            value: ${var.lakebase_schema}
          - name: GOVAT_LAKEBASE_UC_CATALOG
            value: ${var.lakebase_uc_catalog}
          - name: GOVAT_DATAPACT_CATALOG
            value: ${var.datapact_catalog}
          - name: GOVAT_AI_GENERATION_ENDPOINT
            value: ${var.ai_generation_endpoint}
          - name: GOVAT_LINEAGE_LOOKBACK_DAYS
            value: ${var.lineage_lookback_days}
          - name: GOVAT_AI_FEATURES_ENABLED
            value: ${var.ai_features_enabled}
          - name: GOVAT_AI_INTAKE_TAG_KEY
            value: ${var.ai_intake_tag_key}
          - name: GOVAT_AI_TIER_TAG_KEY
            value: ${var.ai_tier_tag_key}
          - name: GOVAT_AI_CATALOG_ALLOWLIST
            value: ${var.ai_catalog_allowlist}
          - name: GOVAT_AI_TOOL_SCHEMA_ALLOWLIST
            value: ${var.ai_tool_schema_allowlist}
          - name: GOVAT_AI_INTAKE_GRACE_DAYS
            value: ${var.ai_intake_grace_days}
      # OBO (on-behalf-of-user) scopes. Without these declared here, every
      # `bundle deploy` wipes scopes the operator set in the Databricks UI,
      # which silently demotes user reads to app-principal fallback and makes
      # truthful degradation banners fire for every signed-in user.
      #
      # The `iam.current-user:read` and `iam.access-control:read` scopes are
      # NOT listed — Databricks Apps rejects them as invalid when configured
      # via bundle deploy, but the platform grants them implicitly (they show
      # up in `effective_user_api_scopes` on the deployed app regardless).
      user_api_scopes:
        - sql
        - catalog.catalogs:read
        - catalog.schemas:read
        - catalog.tables:read
        - catalog.connections
        - dashboards.genie
        # Lets AI autofill query the foundation-model serving endpoint.
        - serving.serving-endpoints
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE

      permissions:
        - level: CAN_USE
          group_name: users

# ── Targets (environments) ──────────────────────────────────
# Each target maps to a Databricks workspace + profile.
# `databricks bundle deploy --profile DEFAULT -t <target>` selects the environment.
targets:
  dev:
    mode: development
    default: true
    # Binds Genie + model serving + Lakebase, so BUNDLE_VAR_genie_space_id,
    # BUNDLE_VAR_lakebase_branch and BUNDLE_VAR_lakebase_database_resource must
    # be set (see .env.example); all other values also come from BUNDLE_VAR_*.
    variables:
      deploy_target: "Dev"
    resources:
      apps:
        atlas:
          resources:
            - name: sql-warehouse
              sql_warehouse:
                id: ${var.warehouse_id}
                permission: CAN_USE
            - name: atlas-genie-space
              genie_space:
                name: Governance Atlas Metadata Room
                space_id: ${var.genie_space_id}
                permission: CAN_RUN
            # Grants the app service principal CAN_QUERY on the reasoning model
            # used by AI autofill (drafts glossary definitions, etc.).
            - name: atlas-ai-generation
              serving_endpoint:
                name: ${var.ai_generation_endpoint}
                permission: CAN_QUERY
            - name: atlas-lakebase
              postgres:
                branch: ${var.lakebase_branch}
                database: ${var.lakebase_database_resource}
                permission: CAN_CONNECT_AND_CREATE

  # staging/prod: deploy ONLY from CI as a service principal (see
  # .github/workflows/deploy.yml). Production mode blocks development-mode
  # shortcuts, and because root_path is the deploying identity's home, a
  # service-principal deploy lands under that SP, not a person's folder.
  staging:
    mode: production
    # The AI collector job runs as a dedicated service principal outside dev.
    run_as:
      service_principal_name: ${var.ai_collector_sp}
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      deploy_target: "Stage"

  prod:
    mode: production
    # The AI collector job runs as a dedicated service principal outside dev.
    run_as:
      service_principal_name: ${var.ai_collector_sp}
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      deploy_target: "Prod"
